<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email &amp; SMS Prompt Kit — by Nudge Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
/* ============================================
   Email & SMS Prompt Kit — Nudge Studio
   Tokens + base
   ============================================ */

:root {
  /* Color */
  --bg: #FFFCF9;
  --bg-2: #F6F1EA;        /* card surface, slightly deeper */
  --bg-3: #ECE5DB;        /* trust strip / quiet bands */
  --ink: #232121;
  --ink-2: #4A4644;       /* secondary text */
  --ink-3: #7A7572;       /* tertiary / mono labels */
  --line: #E4DCCF;        /* hairlines on warm bg */
  --line-strong: #232121;
  --accent: #F96353;
  --accent-ink: #FFFFFF;
  --accent-deep: #D94838;
  --accent-tint: #FFE9E5;

  /* Type */
  --font-display: "Inter Tight", "Inter", -apple-system, system-ui, sans-serif;
  --font-body: "Inter", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Scale (desktop) */
  --fs-display: clamp(40px, 5.8vw, 80px);
  --fs-h1: clamp(32px, 4vw, 56px);
  --fs-h2: clamp(26px, 2.8vw, 40px);
  --fs-h3: clamp(19px, 1.8vw, 24px);
  --fs-lead: clamp(16px, 1.2vw, 18px);
  --fs-body: 16px;
  --fs-small: 14px;
  --fs-micro: 12px;

  /* Spacing */
  --container: 1200px;
  --gutter: clamp(20px, 4vw, 56px);
  --section: clamp(72px, 9vw, 144px);

  --radius: 6px;
  --radius-lg: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body { overflow-x: hidden; }

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  padding: 0;
}

img, svg { display: block; max-width: 100%; }

::selection { background: var(--accent); color: var(--accent-ink); }

/* ============================================
   Layout primitives
   ============================================ */

.container {
  width: 100%;
  max-width: var(--container);
  margin: 0 auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter);
}

.section { padding-block: var(--section); }
.section-tight { padding-block: clamp(48px, 6vw, 88px); }

/* ============================================
   Type primitives
   ============================================ */

.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.eyebrow-accent { color: var(--accent-deep); }

.display {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--fs-display);
  line-height: 0.96;
  letter-spacing: -0.035em;
  margin: 0;
  text-wrap: balance;
}

h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.025em; line-height: 1.05; font-weight: 600; text-wrap: balance; }
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }
h4 { font-size: 18px; }

.lead {
  font-size: var(--fs-lead);
  line-height: 1.45;
  color: var(--ink-2);
  text-wrap: pretty;
  max-width: 56ch;
}

.mono { font-family: var(--font-mono); }

/* ============================================
   Buttons
   ============================================ */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: -0.005em;
  line-height: 1;
  white-space: nowrap;
  transition: transform 80ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease;
  user-select: none;
}

.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--ink);
  color: var(--bg);
  border: 1px solid var(--ink);
}
.btn-primary:hover { background: #000; }

.btn-accent {
  background: var(--accent);
  color: var(--accent-ink);
  border: 1px solid var(--accent);
}
.btn-accent:hover { background: var(--accent-deep); border-color: var(--accent-deep); }

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn-ghost:hover { border-color: var(--ink); }

.btn-sm { padding: 10px 14px; font-size: 14px; }
.btn-lg { padding: 18px 24px; font-size: 16px; }

/* ============================================
   Cards / surfaces
   ============================================ */

.card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 28px;
  transition: border-color 150ms ease, transform 150ms ease;
}

.card-hover:hover {
  border-color: var(--ink);
}

.surface-2 { background: var(--bg-2); }
.surface-3 { background: var(--bg-3); }
.surface-ink { background: var(--ink); color: var(--bg); }

/* ============================================
   Chips / tags
   ============================================ */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink-2);
  white-space: nowrap;
}

.chip-ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-accent { background: var(--accent-tint); color: var(--accent-deep); border-color: transparent; }
.chip-email { background: #E8EFFE; color: #1F4FB8; border-color: transparent; }
.chip-sms { background: #E5F4EC; color: #1F6B47; border-color: transparent; }
.chip-strategy { background: #F1ECE3; color: #6B5A2A; border-color: transparent; }
.chip-cross { background: #F0E8F4; color: #5E2A85; border-color: transparent; }

/* ============================================
   Utility
   ============================================ */

.hairline { height: 1px; background: var(--line); border: 0; margin: 0; }
.hairline-strong { height: 1px; background: var(--ink); border: 0; margin: 0; }

.cluster { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.stack-1 { display: flex; flex-direction: column; gap: 4px; }
.stack-2 { display: flex; flex-direction: column; gap: 8px; }
.stack-3 { display: flex; flex-direction: column; gap: 12px; }
.stack-4 { display: flex; flex-direction: column; gap: 16px; }
.stack-6 { display: flex; flex-direction: column; gap: 24px; }
.stack-8 { display: flex; flex-direction: column; gap: 32px; }

.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }

.row-strikethrough {
  position: relative;
  display: inline-block;
}
.row-strikethrough::after {
  content: "";
  position: absolute;
  inset: 50% 0 auto 0;
  height: 1.5px;
  background: currentColor;
  transform: translateY(-50%) rotate(-4deg);
}

/* ============================================
   Animations
   ============================================ */

@keyframes copied-pop {
  0% { transform: scale(.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fade-in 220ms ease both; }

/* ============================================
   Responsive
   ============================================ */

@media (max-width: 760px) {
  :root {
    --section: 64px;
  }
  .card { padding: 22px; }
}

/* page-styles.css — Email & SMS Prompt Kit page-specific styles */

/* ============================================
   Nav
   ============================================ */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 252, 249, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
  transition: border-color 200ms ease, background 200ms ease;
}
.nav-scrolled {
  border-bottom-color: var(--line);
  background: rgba(255, 252, 249, 0.92);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-brand { display: flex; align-items: center; gap: 12px; }
.nav-brand-text { display: flex; flex-direction: column; gap: 6px; }
.nav-brand-product { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; line-height: 1; }
.nav-brand-by { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; line-height: 1; }
.nav-actions { display: flex; align-items: center; gap: 22px; }
.nav-link { font-size: 14px; color: var(--ink-2); }
.nav-link:hover { color: var(--ink); }

@media (max-width: 760px) {
  .nav-link { display: none; }
  .nav-brand-by { display: none; }
}

/* ============================================
   Coupon banner
   ============================================ */
.coupon-banner {
  background: var(--accent-tint);
  border-bottom: 1px solid var(--line);
}
.coupon-banner-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-block: 14px;
  font-size: 14px;
  color: var(--accent-deep);
}
.coupon-banner p { margin: 0; }

/* ============================================
   Hero
   ============================================ */
.hero { padding-top: clamp(48px, 7vw, 96px); padding-bottom: clamp(48px, 7vw, 96px); }
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: clamp(32px, 5vw, 80px);
  align-items: start;
}
.hero-copy .eyebrow { margin-bottom: 24px; display: block; margin-top: 0; line-height: 1; }
.hero-grid > .buy-card { margin-top: 0; }
.hero-h1-accent { color: var(--accent); }
.hero-copy .lead { margin-top: 28px; }
.hero-bullets {
  display: flex; flex-wrap: wrap; gap: 8px 24px;
  list-style: none; padding: 0; margin: 28px 0 0;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.hero-bullets li { position: relative; padding-left: 16px; }
.hero-bullets li::before {
  content: ""; position: absolute; left: 0; top: 50%;
  width: 8px; height: 1px; background: var(--accent);
  transform: translateY(-50%);
}
.hero-microproof { margin-top: 24px; font-style: italic; color: var(--ink-2); font-size: 15px; }

@media (max-width: 880px) {
  .hero-grid { grid-template-columns: 1fr; }
}

/* Buy card */
.buy-card {
  background: var(--bg);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: 6px 6px 0 var(--ink);
}
.buy-card-head { display: flex; justify-content: space-between; align-items: center; }
.buy-card-price { display: flex; align-items: baseline; gap: 14px; margin-top: 18px; }
.buy-card-price-now {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(56px, 6vw, 80px);
  letter-spacing: -0.04em;
  line-height: 1;
}
.buy-card-price-was { color: var(--ink-3); font-size: 15px; }
.buy-card-divider { height: 1px; background: var(--line); margin: 22px 0; }
.stripe-btn {
  width: 100%;
  background: #635BFF; /* Stripe canon — fine for a checkout button */
  color: white;
  border-radius: 8px;
  padding: 18px;
  font-weight: 600;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: background 120ms ease, transform 80ms ease;
  cursor: pointer;
}
.stripe-btn:hover { background: #4F46E5; }
.stripe-btn:active { transform: translateY(1px); }
.paymethods {
  display: flex; align-items: center; justify-content: center;
  gap: 14px; margin-top: 14px;
  color: var(--ink-2);
}
.paylogo { display: inline-flex; align-items: center; }
.buy-card-trust { margin-top: 18px; font-size: 13px; }
.buy-card-trust p { margin: 0; }
.buy-card-trust p + p { margin-top: 6px; }

@media (max-width: 880px) {
  .buy-card { position: relative; top: 0; }
}

/* ============================================
   Price banner (inverted strip)
   ============================================ */
.price-banner { padding: clamp(56px, 7vw, 96px) 0; }
.price-banner-h2 {
  font-size: clamp(28px, 3.4vw, 44px);
  font-weight: 600;
  margin: 16px 0 22px;
  max-width: 18ch;
  line-height: 1.02;
  letter-spacing: -0.03em;
}
.price-banner-body {
  max-width: 60ch;
  font-size: clamp(16px, 1.5vw, 19px);
  color: rgba(255, 252, 249, 0.78);
  line-height: 1.5;
}

/* ============================================
   Trust strip
   ============================================ */
.trust-strip {
  background: var(--bg-3);
  padding: 36px 0;
  border-bottom: 1px solid var(--line);
}
.trust-strip-inner {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 24px;
  align-items: center;
}
.trust-stat { display: flex; flex-direction: column; gap: 4px; }
.trust-stat-big {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(22px, 2.2vw, 28px);
  letter-spacing: -0.02em;
}
.trust-stat-small {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
}

@media (max-width: 760px) {
  .trust-strip-inner { grid-template-columns: repeat(2, 1fr); gap: 20px 24px; }
}

/* ============================================
   Section heads (used everywhere)
   ============================================ */
.section-head { margin-bottom: clamp(32px, 4vw, 56px); max-width: 64ch; }
.section-head .eyebrow { display: block; margin-bottom: 14px; }
.section-head h2 { margin-bottom: 18px; }

/* ============================================
   Pitch (the wedge)
   ============================================ */
.pitch-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  gap: clamp(32px, 5vw, 72px);
  align-items: start;
}
@media (max-width: 960px) {
  .pitch-grid { grid-template-columns: 1fr; }
}

/* ============================================
   Prompt render (the proof component)
   ============================================ */
.prompt-render {
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--ink);
  font-family: var(--font-mono);
}
.prompt-render-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  background: #1A1818;
  border-bottom: 1px solid #2D2929;
}
.prompt-render-head .btn-ghost {
  color: var(--bg);
  border-color: #3A3534;
  background: transparent;
}
.prompt-render-head .btn-ghost:hover { border-color: var(--bg); }
.prompt-render-head .btn-accent { background: var(--accent); border-color: var(--accent); color: white; }
.prompt-render-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #3A3534; display: inline-block;
}
.prompt-render-filename {
  margin-left: 12px;
  font-size: 12px;
  color: rgba(255,252,249,0.55);
}
.prompt-render-body {
  max-height: 720px;
  overflow: auto;
}
.prompt-render-compact .prompt-render-body { max-height: 720px; }
.prompt-section { border-bottom: 1px solid #2D2929; }
.prompt-section:last-child { border-bottom: 0; }
.prompt-section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  background: rgba(249, 99, 83, 0.06);
}
.prompt-section-key {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.prompt-section-head .btn-ghost {
  color: rgba(255,252,249,0.6);
  border: 0;
  background: transparent;
  font-size: 11px;
  padding: 4px 8px;
}
.prompt-section-head .btn-ghost:hover { color: var(--bg); }
.prompt-section-body {
  margin: 0;
  padding: 16px 18px 22px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: rgba(255,252,249,0.86);
  white-space: pre-wrap;
  word-break: break-word;
}

/* ============================================
   Samples grid
   ============================================ */
.samples-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
@media (max-width: 960px) { .samples-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .samples-grid { grid-template-columns: 1fr; } }

.sample-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 240px;
  position: relative;
}
.sample-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.sample-card-num {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 36px;
  color: var(--ink-3);
  letter-spacing: -0.02em;
  opacity: 0.4;
}
.sample-card-title { font-size: 20px; line-height: 1.15; }
.sample-card-desc { font-size: 14px; flex: 1; }
.sample-card-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.sample-card-link { font-size: 13px; display: inline-flex; align-items: center; gap: 8px; color: var(--accent-deep); font-weight: 500; }
.sample-card:hover .sample-card-link { gap: 12px; }
.sample-card:hover .sample-card-num { color: var(--accent); opacity: 1; }

/* ============================================
   Why-not-slop grid
   ============================================ */
.why-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}
.why-card {
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: 36px 32px;
  background: transparent;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.why-card-num {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--accent);
  font-weight: 600;
}
.why-card h3 { font-size: 22px; line-height: 1.15; }
.why-card p { font-size: 15px; line-height: 1.5; }

@media (max-width: 960px) { .why-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .why-grid { grid-template-columns: 1fr; } }

/* ============================================
   Inside the kit
   ============================================ */
.inside-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.inside-card {
  display: grid;
  grid-template-columns: minmax(140px, 180px) 1fr;
  gap: 24px;
  padding: 28px 0;
  border-top: 1px solid var(--line);
  align-items: start;
}
.inside-card-num { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.inside-card-text h3 { font-size: 22px; }
.inside-card-text p { margin-top: 8px; font-size: 15px; }

@media (max-width: 760px) {
  .inside-grid { grid-template-columns: 1fr; }
  .inside-card { grid-template-columns: 1fr; gap: 8px; }
}

/* ============================================
   Who uses
   ============================================ */
.who-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--ink);
}
.who-card {
  padding: 32px 24px 32px 40px;
  border-left: 1px solid var(--line);
}
.who-card:first-child { padding-left: 0; border-left: 0; }
.who-card:last-child { padding-right: 0; }
.who-card h3 { font-size: 24px; }
.who-card p { font-size: 15px; }

@media (max-width: 880px) {
  .who-grid { grid-template-columns: repeat(2, 1fr); }
  .who-card { padding: 28px; border-bottom: 1px solid var(--line); }
  .who-card:nth-child(odd) { border-left: 0; padding-left: 0; }
  .who-card:nth-child(even) { padding-right: 0; }
}
@media (max-width: 540px) {
  .who-grid { grid-template-columns: 1fr; }
  .who-card { border-left: 0; padding: 28px 0; }
}

/* ============================================
   FAQ
   ============================================ */
.faq-list { border-top: 1px solid var(--ink); }
.faq-item { border-bottom: 1px solid var(--line); }
.faq-item.faq-open { border-bottom-color: var(--ink); }
.faq-q {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  padding: 24px 0;
  font-family: var(--font-display);
  font-size: clamp(18px, 1.8vw, 22px);
  font-weight: 600;
  letter-spacing: -0.015em;
  text-align: left;
}
.faq-toggle {
  font-family: var(--font-mono);
  font-size: 22px;
  color: var(--accent);
  width: 28px; text-align: center;
}
.faq-a {
  padding: 0 56px 28px 0;
  font-size: 16px;
  max-width: 70ch;
  animation: fade-in 200ms ease both;
}

/* ============================================
   Final CTA
   ============================================ */
.final-cta { padding-top: clamp(72px, 8vw, 120px); padding-bottom: clamp(72px, 8vw, 120px); border-top: 1px solid var(--line); }
.final-cta .eyebrow { display: block; }
.final-cta-h2 {
  font-size: clamp(36px, 5vw, 64px);
  text-align: center;
  margin: 18px auto 36px;
  max-width: 16ch;
  line-height: 1.0;
}
.final-cta-actions { display: flex; justify-content: center; }
.final-cta-code { margin-top: 56px; max-width: 460px; margin-left: auto; margin-right: auto; }
.code-redeem {
  display: flex; gap: 8px; margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px;
  background: var(--bg);
}
.code-input {
  flex: 1;
  border: 0; outline: 0; background: transparent;
  padding: 10px 12px;
  font-family: var(--font-mono);
  font-size: 14px;
  letter-spacing: 0.05em;
  color: var(--ink);
}

/* ============================================
   Footer
   ============================================ */
.footer {
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  padding: 56px 0 32px;
}
.footer-cta {
  padding-bottom: 36px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
}
.footer-cta .eyebrow { display: block; margin-bottom: 6px; }
.footer-cta-line { font-size: clamp(20px, 2vw, 26px); font-family: var(--font-display); font-weight: 500; letter-spacing: -0.02em; margin: 0; }
.footer-cta-line .link { color: var(--accent-deep); }
.footer-cta-line .link:hover { color: var(--accent); }
.footer-meta {
  display: flex; justify-content: space-between; gap: 24px;
  font-size: 13px;
}
@media (max-width: 640px) {
  .footer-meta { flex-direction: column; }
}

/* link utility */
.link { color: var(--accent-deep); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.link:hover { color: var(--accent); }

/* ============================================
   Library
   ============================================ */
.library-hero {
  padding: clamp(48px, 6vw, 88px) 0 clamp(28px, 3vw, 48px);
}
.library-hero h1 { font-size: clamp(32px, 4.2vw, 56px); margin-top: 14px; }
.library-actions { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }

.library-toolbar {
  position: sticky; top: 64px; z-index: 30;
  background: rgba(255,252,249,0.95);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 16px 0;
}
.library-toolbar-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
}
.search {
  flex: 1;
  display: flex; align-items: center; gap: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
  color: var(--ink-3);
  max-width: 480px;
}
.search:focus-within { border-color: var(--ink); color: var(--ink); }
.search input {
  flex: 1;
  border: 0; outline: 0; background: transparent;
  font-size: 14px;
  font-family: var(--font-body);
  color: var(--ink);
}
.search-clear { color: var(--ink-3); font-size: 18px; line-height: 1; padding: 0 4px; }
.search-clear:hover { color: var(--ink); }

.tag-filter { display: flex; gap: 6px; }
.tag-pill {
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  border: 1px solid var(--line);
  background: var(--bg);
}
.tag-pill:hover { border-color: var(--ink); }
.tag-pill-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.category-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}
.cat-chip {
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid var(--line);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.cat-chip:hover { border-color: var(--ink); color: var(--ink); }
.cat-chip-on { background: var(--accent); color: white; border-color: var(--accent); }
.cat-chip-on:hover { color: white; }
.cat-chip-count {
  font-family: var(--font-mono);
  font-size: 10px;
  opacity: 0.6;
}

.library-content { padding: clamp(24px, 4vw, 56px) var(--gutter); }
.library-result-bar { padding: 20px 0; }

.start-here {
  margin-bottom: 48px;
  padding: 36px;
  background: var(--accent-tint);
  border-radius: var(--radius-lg);
  border: 1px solid #F3D5CF;
}
.start-here-head { margin-bottom: 24px; max-width: 60ch; }
.start-here-head h2 { font-size: clamp(24px, 3vw, 36px); margin-top: 8px; }
.start-here-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 880px) { .start-here-grid { grid-template-columns: 1fr; } }

.prompt-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 1080px) { .prompt-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .prompt-grid { grid-template-columns: 1fr; } }

.prompt-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 200px;
  transition: border-color 150ms ease, transform 150ms ease;
}
.prompt-card:hover { border-color: var(--ink); transform: translateY(-2px); }
.prompt-card-featured { background: white; border-color: #F3D5CF; }
.prompt-card-top { display: flex; align-items: center; justify-content: space-between; }
.prompt-card-num { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.prompt-card-title { font-size: 18px; line-height: 1.2; }
.prompt-card-desc { font-size: 13.5px; flex: 1; line-height: 1.45; }
.prompt-card-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--line); }
.prompt-card-arrow { color: var(--accent); display: inline-flex; }

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 72px 24px;
  border: 1px dashed var(--line);
  border-radius: var(--radius-lg);
}

/* ============================================
   Prompt page
   ============================================ */
.prompt-page-crumb { padding-top: 24px; padding-bottom: 8px; font-size: 13px; }
.prompt-page-head { padding-top: 24px; padding-bottom: 36px; }
.prompt-page-num {
  font-size: 12px;
  color: var(--accent-deep);
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 18px;
  display: block;
}
.prompt-page-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  padding: 28px var(--gutter);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-bottom: 36px;
  background: var(--bg-2);
}
.meta-block .eyebrow { display: block; margin-bottom: 8px; }
.meta-block p { margin: 0; max-width: 50ch; font-size: 15px; }
@media (max-width: 720px) { .prompt-page-meta { grid-template-columns: 1fr; gap: 18px; } }

.prompt-page-cta {
  padding-bottom: 24px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.prompt-page-tips { padding-top: 48px; padding-bottom: 24px; }
.prompt-page-tips .eyebrow { display: block; margin-bottom: 14px; }
.tips-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 12px;
  counter-reset: tip;
  max-width: 70ch;
}
.tips-list li {
  position: relative;
  padding: 16px 18px 16px 56px;
  background: var(--bg-2);
  border-radius: var(--radius);
  font-size: 15px;
  counter-increment: tip;
}
.tips-list li::before {
  content: counter(tip, decimal-leading-zero);
  position: absolute;
  left: 18px; top: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent-deep);
  font-weight: 600;
}

.prompt-page-output { padding-top: 36px; padding-bottom: 36px; }
.output-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  background: var(--bg);
}
.output-toggle:hover { border-color: var(--ink); }
.output-preview {
  margin-top: 18px;
  padding: 24px;
  background: var(--bg-2);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
}
.output-body {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-word;
}

.prompt-page-next { padding-top: 56px; padding-bottom: 80px; }
.prompt-page-next .eyebrow { display: block; margin-bottom: 8px; }
.prompt-page-next h2 { margin-bottom: 12px; font-size: clamp(28px, 3vw, 40px); }
.prompt-page-next .lead { margin-bottom: 28px; max-width: 56ch; }
.next-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
@media (max-width: 720px) { .next-grid { grid-template-columns: 1fr; } }

.prompt-card-locked {
  position: relative;
  background: rgba(20, 18, 18, 0.02);
  border: 1px dashed rgba(20, 18, 18, 0.22);
}
.prompt-card-locked:hover {
  border-color: var(--accent);
  background: rgba(249, 99, 83, 0.04);
}
.prompt-card-locked-tag {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(20, 18, 18, 0.5);
  font-weight: 600;
}
.prompt-card-locked-cta {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
}

.prompt-page-next-cta {
  margin-top: 72px;
  padding: 40px 44px;
  border-radius: 16px;
  background: var(--ink);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}
.prompt-page-next-cta-text { flex: 1; min-width: 280px; }
.prompt-page-next-cta h3 {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.4vw, 28px);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.15;
  margin: 0 0 6px;
  color: var(--bg);
}
.prompt-page-next-cta .muted {
  color: rgba(255, 252, 249, 0.62);
  margin: 0;
  font-size: 15px;
}
.prompt-page-next-cta .btn-ghost {
  color: var(--bg);
  border-color: rgba(255,252,249,0.25);
  background: transparent;
}
.prompt-page-next-cta .btn-ghost:hover {
  border-color: var(--bg);
}
@media (max-width: 720px) {
  .prompt-page-next-cta { padding: 24px; }
  .prompt-page-next-cta .cluster { width: 100%; }
}

/* ============================================
   Lead gate — free Welcome Email #1
   ============================================ */
.lead-gate {
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.lead-gate-grid {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 64px;
  align-items: center;
}
@media (max-width: 880px) {
  .lead-gate-grid { grid-template-columns: 1fr; gap: 36px; }
}
.lead-gate-copy .eyebrow { display: block; margin-bottom: 18px; }
.lead-gate-h2 {
  font-size: clamp(28px, 3.2vw, 44px);
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.04;
  margin: 0 0 20px;
}
.lead-gate-h2-accent { color: var(--accent); }
.lead-gate-copy .lead { max-width: 48ch; margin-bottom: 24px; }
.lead-gate-bullets {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.lead-gate-bullets li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  color: var(--ink);
}
.lead-gate-bullets li svg {
  color: var(--accent);
  flex-shrink: 0;
}

/* Form card */
.lead-gate-card {
  background: var(--bg);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: 6px 6px 0 var(--ink);
}
.lead-gate-form { display: flex; flex-direction: column; gap: 18px; }
.lead-gate-form-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lead-gate-form-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
  line-height: 1.1;
}
.lead-gate-field { display: flex; flex-direction: column; gap: 8px; }
.lead-gate-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
}
.lead-gate-input {
  width: 100%;
  padding: 14px 16px;
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  outline: none;
  transition: border-color 120ms ease;
}
.lead-gate-input::placeholder { color: var(--ink-3); }
.lead-gate-input:focus { border-color: var(--ink); }
.lead-gate-input-error { border-color: var(--accent); }
.lead-gate-error {
  font-size: 13px;
  color: var(--accent-deep);
}
.lead-gate-submit {
  background: var(--ink);
  margin-top: 4px;
}
.lead-gate-submit:hover { background: #2A2727; }
.lead-gate-submit:disabled { opacity: 0.6; cursor: progress; }
.lead-gate-fineprint {
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
}

/* Success state */
.lead-gate-success {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: left;
}
.lead-gate-success-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.lead-gate-success-icon svg { width: 20px; height: 20px; }
.lead-gate-success h3 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.15;
  margin: 0;
}
.lead-gate-success p { margin: 0; font-size: 15px; line-height: 1.55; }
.lead-gate-success-divider {
  height: 1px;
  background: var(--line);
  margin: 12px 0 8px;
}
.lead-gate-success-up {
  font-size: 15px;
  margin: 0;
  color: var(--ink);
}
.lead-gate-success .btn-primary { width: 100%; justify-content: center; margin-top: 6px; }

/* ============================================
   Prompt render — preview / locked state
   ============================================ */
.prompt-render-preview { position: relative; }
.prompt-render-preview .prompt-render-body {
  max-height: none;
  overflow: hidden;
  position: relative;
}
.prompt-render-preview .prompt-section-locked {
  position: relative;
}
.prompt-render-preview .prompt-section-locked::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(20, 18, 18, 0) 0%, rgba(20, 18, 18, 0.55) 60%, rgba(20, 18, 18, 0.85) 100%);
  pointer-events: none;
}
.prompt-render-preview .prompt-section-locked .prompt-section-body {
  filter: blur(1.5px);
  opacity: 0.7;
}
.prompt-render-locked-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  padding: 6px 10px;
  border: 1px solid rgba(249, 99, 83, 0.35);
  border-radius: 999px;
}
.prompt-render-unlock {
  border-top: 1px solid #2D2929;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(249, 99, 83, 0.08) 0%, transparent 70%),
    var(--ink);
  padding: 36px 32px 40px;
  text-align: center;
}
.prompt-render-unlock-inner {
  max-width: 420px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.prompt-render-unlock h3 {
  font-family: var(--font-display);
  font-size: clamp(20px, 2vw, 26px);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.15;
  margin: 0;
  color: var(--bg);
}
.prompt-render-unlock .muted {
  color: rgba(255, 252, 249, 0.62);
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 8px;
}
.prompt-render-unlock .btn-primary {
  margin-top: 6px;
}

/* ============================================
   Mobile pass — phones (≤540px)
   ============================================ */
@media (max-width: 540px) {
  :root {
    --gutter: 18px;
    --section: 56px;
  }

  /* Coupon banner stacks */
  .coupon-banner-inner { flex-direction: column; align-items: flex-start; gap: 8px; padding-block: 12px; }
  .coupon-banner-inner p { font-size: 13px; line-height: 1.45; }

  /* Nav: tighten brand + reduce vertical padding */
  .nav-inner { padding-block: 14px; }
  .nav-brand-product { font-size: 14px; }

  /* Hero */
  .hero { padding-top: 32px; padding-bottom: 40px; }
  .hero-grid { gap: 36px; }
  .hero-bullets { gap: 6px 18px; font-size: 11px; }
  .hero-microproof { font-size: 14px; margin-top: 18px; }

  /* Buy card — tighter, smaller price */
  .buy-card { padding: 22px; box-shadow: 4px 4px 0 var(--ink); }
  .buy-card-price-now { font-size: 56px; }
  .buy-card-price-was { font-size: 13px; }
  .buy-card-divider { margin: 18px 0; }
  .stripe-btn { padding: 16px; font-size: 15px; }
  .paymethods { gap: 10px; }
  .buy-card-trust { font-size: 12px; }

  /* Price banner — pull in copy width */
  .price-banner-h2 { max-width: 14ch; }
  .price-banner-body { font-size: 15px; }

  /* Trust strip — tighter padding */
  .trust-strip { padding: 28px 0; }
  .trust-strip-inner { gap: 16px 20px; }
  .trust-stat-big { font-size: 20px; }
  .trust-stat-small { font-size: 10px; }

  /* Section heads */
  .section-head { margin-bottom: 28px; }

  /* Pitch — smaller copy */
  .pitch-copy h2 { font-size: clamp(24px, 7vw, 32px); }
  .pitch-copy .stack-4 { font-size: 15px !important; margin-top: 24px !important; }

  /* Prompt render */
  .prompt-render { border-radius: 12px; }
  .prompt-render-head { padding: 12px 14px; }
  .prompt-render-filename { font-size: 11px; margin-left: 8px; }
  .prompt-render-dot { width: 8px; height: 8px; }
  .prompt-section-head { padding: 12px 16px; }
  .prompt-section-key { font-size: 10px; }
  .prompt-section-body { padding: 0 16px 16px; font-size: 12px; line-height: 1.55; }
  .prompt-render-unlock { padding: 28px 22px 32px; }
  .prompt-render-unlock h3 { font-size: 19px; }
  .prompt-render-unlock .muted { font-size: 13px; }
  .prompt-render-unlock .btn-lg { padding: 14px 18px; font-size: 15px; width: 100%; justify-content: center; }

  /* Sample cards */
  .sample-card { padding: 22px; }
  .sample-card-title { font-size: 19px; }
  .sample-card-desc { font-size: 14px; }

  /* Why-not-slop cards */
  .why-card { padding: 24px; }
  .why-card h3 { font-size: 17px; }
  .why-card p { font-size: 14px; }

  /* Inside the kit */
  .inside-card { padding: 22px; }
  .inside-card-text h3 { font-size: 18px; }

  /* Who buys this */
  .who-card h3 { font-size: 19px; }
  .who-card p { font-size: 14px; }

  /* FAQ */
  .faq-q { padding: 20px 0; font-size: 16px; }
  .faq-a { font-size: 14px; padding-bottom: 18px; }

  /* Final CTA */
  .final-cta-h2 { font-size: clamp(30px, 8vw, 40px); margin: 14px auto 28px; }
  .final-cta-actions .btn-lg { width: 100%; justify-content: center; }

  /* Footer */
  .footer-cta-line { font-size: 18px; }
  .footer-meta { gap: 12px; font-size: 12px; }

  /* Lead gate */
  .lead-gate-grid { gap: 28px; }
  .lead-gate-card { padding: 24px; box-shadow: 4px 4px 0 var(--ink); }
  .lead-gate-form-title { font-size: 20px; }
  .lead-gate-bullets li { font-size: 14px; }
  .lead-gate-h2 { font-size: clamp(28px, 8vw, 36px); }
  .lead-gate-copy .lead { font-size: 15px; }
  .lead-gate-fineprint { font-size: 12px; }
  .lead-gate-success h3 { font-size: 20px; }

  /* Library page */
  .library-hero { padding-top: 32px; padding-bottom: 24px; }
  .library-hero h1 { font-size: clamp(32px, 9vw, 44px); }
  .library-actions { gap: 8px; }
  .library-actions .btn { font-size: 13px; padding: 10px 14px; }

  /* Prompt page head */
  .prompt-page-head { padding-top: 20px; }

  return <button className={cls} onClick={onClick} {...rest}>{children}</button>;
}

  const [copied, setCopied] = useState(false);

/* ============================================
   Prompt renderer — the proof component
   ============================================ */
function PromptRender({ body, compact = false, prompt, preview = false }) {
  const fullText = useMemo(() => body.sections.map(s => `${s.key}\n${s.body}`).join("\n\n"), [body]);
  const teaser = (s) => {
    // First sentence or first ~140 chars, whichever is shorter
    const flat = s.body.replace(/\s+/g, " ").trim();
    const firstStop = flat.search(/[.!?]\s/);
    const cut = firstStop > 0 && firstStop < 160 ? firstStop + 1 : 140;
    return flat.length > cut ? flat.slice(0, cut).trim() + "…" : flat;
  };
  return (
    <div className={`prompt-render ${compact ? "prompt-render-compact" : ""} ${preview ? "prompt-render-preview" : ""}`}>
      <div className="prompt-render-head">
        <div className="cluster" style={{gap:8}}>
          <span className="prompt-render-dot"></span>
          <span className="prompt-render-dot"></span>
          <span className="prompt-render-dot"></span>
          <span className="prompt-render-filename">prompt-{prompt?.n ?? 11}.md</span>
        </div>
        {preview
          ? <span className="prompt-render-locked-tag mono">Preview</span>
          : <CopyBtn text={fullText} small label="Copy prompt" />
        }
      </div>
      <div className="prompt-render-body">
        {body.sections.map((s, i) => (
          <div className={`prompt-section ${preview && i > 0 ? "prompt-section-locked" : ""}`} key={s.key}>
            <div className="prompt-section-head">
              <span className="prompt-section-key">{s.key}</span>
              {!preview && <CopyBtn text={s.body} small label="Copy" />}
            </div>
            <pre className="prompt-section-body">{preview ? teaser(s) : s.body}</pre>
          </div>
        ))}
      </div>
      {preview && (
        <div className="prompt-render-unlock">
          <div className="prompt-render-unlock-inner">
            <p className="eyebrow eyebrow-accent">Locked</p>
            <h3>Full prompt unlocks at checkout.</h3>
            <p className="muted">All 7 sections — role, job, inputs, method, constraints, output format, quality bar. Paste-ready in Claude or ChatGPT.</p>
            <a className="btn btn-primary btn-lg" href="#/kit#buy" onClick={() => go("/kit#buy")}>Get the kit, $19 <ArrowIcon /></a>
          </div>
        </div>
      )}
    </div>
  );
}

            <button className="btn btn-ghost btn-sm">Email me the full kit again</button>
            <button className="btn btn-ghost btn-sm">Download PDF</button>
            <button className="btn btn-ghost btn-sm">Notion file</button>
          </div>
        </div>
      </section>

      <div className="library-toolbar">
        <div className="container library-toolbar-inner">
          <div className="search">
            <SearchIcon />
            <input
              placeholder="Search 175 prompts…"
              value={q}
              onChange={e => setQ(e.target.value)}
            />
            {q && <button className="search-clear" onClick={()=>setQ("")}>×</button>}
          </div>
          <div className="tag-filter">
            {[
              ["all", "All"],
              ["E", "Email"],
              ["S", "SMS"],
              ["E+S", "Cross-channel"],
              ["STR", "Strategy"],
            ].map(([id, label]) => (
              <button
                key={id}
                className={`tag-pill ${activeTag === id ? "tag-pill-on" : ""}`}
                onClick={() => setActiveTag(id)}
              >{label}</button>
            ))}
          </div>
        </div>
        <div className="container category-strip">
          <button className={`cat-chip ${activeCat==="all"?"cat-chip-on":""}`} onClick={()=>setActiveCat("all")}>All categories</button>
          {KIT.CATEGORIES.map(c => (
            <button
              key={c.id}
              className={`cat-chip ${activeCat===c.id?"cat-chip-on":""}`}
              onClick={()=>setActiveCat(c.id)}
            >{c.label} <span className="cat-chip-count">{c.count}</span></button>
          ))}
        </div>
      </div>

      <section className="container library-content">
        {activeCat === "all" && activeTag === "all" && !q && (
          <div className="start-here">
            <div className="start-here-head">
              <p className="eyebrow eyebrow-accent">Start here</p>
              <h2>Run these three first.</h2>
              <p className="muted">They produce the voice, persona, and positioning docs that every other prompt builds on.</p>
            </div>
            <div className="start-here-grid">
              {starters.map(p => <PromptCard prompt={p} key={p.slug} featured />)}
            </div>
          </div>
        )}

        <div className="library-result-bar">
          <span className="muted mono" style={{fontSize:13}}>
            Showing {filtered.length} of 175. {activeCat === "all" ? "all categories" : KIT.CATEGORIES.find(c=>c.id===activeCat)?.label}
          </span>
        </div>

        <div className="prompt-grid">
          {filtered.map(p => <PromptCard prompt={p} key={p.slug} />)}
          {filtered.length === 0 && (
            <div className="empty">
              <h3>Nothing matched.</h3>
              <p className="muted">Try one of the popular categories: Welcome, Cart abandon, BFCM, Deliverability.</p>
            </div>
          )}
        </div>
      </section>
    </div>
  );
}

function SearchIcon() {
  return <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <circle cx="7" cy="7" r="4.5" stroke="currentColor" strokeWidth="1.5"/>
    <path d="m11 11 3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="square"/>
  </svg>;
}

function LockedPromptCard({ slug }) {
  // Convert slug to a readable name and infer category
  const name = slug.split("-").map(w => {
    if (/^\d+$/.test(w)) return `#${w}`;
    if (w === "sms") return "SMS";
    if (w === "bfcm") return "BFCM";
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(" ").replace(/^Welcome Email/, "Welcome email").replace(/^Welcome Sms/, "Welcome SMS").replace(/^Cart Abandon/, "Cart abandon");

  // Infer category + tag from slug
  let category = null;
  let tag = "STR";
  if (slug.includes("sms")) tag = "S";
  else if (slug.startsWith("welcome") || slug.startsWith("cart") || slug.includes("email")) tag = "E";
  if (slug.startsWith("welcome")) category = "welcome";
  else if (slug.startsWith("cart")) category = "cart";
  else if (slug.startsWith("bfcm")) category = "bfcm";
  else if (slug.includes("deliverability") || slug.includes("list-health")) category = "deliverability";
  else if (slug.includes("flow")) category = "flows";
  else if (slug.includes("reporting") || slug.includes("test")) category = "ab-test";

  return (
    <a className="prompt-card prompt-card-locked"
       href="#/kit#buy"
       onClick={() => go("/kit#buy")}>
      <div className="prompt-card-top">
        <span className="prompt-card-locked-tag mono">In the kit</span>
        <TagChip tag={tag} />
      </div>
      <h3 className="prompt-card-title">{name}</h3>
      <p className="prompt-card-desc muted">Unlocks with the kit. Same depth, same format.</p>
      <div className="prompt-card-foot">
        {category ? <CategoryChip id={category} /> : <span />}
        <span className="prompt-card-locked-cta">$19 →</span>
      </div>
    </a>
  );
}

function PromptCard({ prompt, featured = false }) {
  return (
    <a className={`prompt-card ${featured ? "prompt-card-featured" : ""}`}
       href={`#/kit/p/${prompt.slug}`}
       onClick={() => go(`/kit/p/${prompt.slug}`)}>
      <div className="prompt-card-top">
        <span className="prompt-card-num mono">#{String(prompt.n).padStart(3,"0")}</span>
        <TagChip tag={prompt.tag} />
      </div>
      <h3 className="prompt-card-title">{prompt.name}</h3>
      <p className="prompt-card-desc muted">{prompt.desc}</p>
      <div className="prompt-card-foot">
        <CategoryChip id={prompt.category} />
        <span className="prompt-card-arrow"><ArrowIcon /></span>
      </div>
    </a>
  );
}

/* ============================================
   Individual prompt page
   ============================================ */
function PromptPage({ slug }) {
  const prompt = KIT.BY_SLUG[slug];
  const body = PROMPT_BODIES[slug];

  if (!prompt) {
    return (
      <div className="container section">
        <h1>Prompt not found</h1>
        <p className="muted">Check the URL or <a className="link" href="#/kit/library" onClick={()=>go("/kit/library")}>head back to the library</a>.</p>
      </div>
    );
  }

  return (
    <div className="prompt-page">
      <div className="container prompt-page-crumb">
        <a className="dim" href="#/kit/library" onClick={()=>go("/kit/library")}>← Back to library</a>
      </div>

      <header className="container prompt-page-head">
        <span className="prompt-page-num mono">#{String(prompt.n).padStart(3,"0")}</span>
        <div className="cluster" style={{gap:10, marginBottom:18}}>
          <TagChip tag={prompt.tag} />
          <CategoryChip id={prompt.category} />
        </div>
        <h1 className="display" style={{fontSize:"clamp(36px,5vw,68px)"}}>{prompt.name}</h1>
        <p className="lead" style={{marginTop:20, maxWidth:"60ch"}}>{prompt.desc}</p>
      </header>

      <section className="container prompt-page-meta">
        <div className="meta-block">
          <p className="eyebrow">What this prompt does</p>
          <p>{prompt.what}</p>
        </div>
        <div className="meta-block">
          <p className="eyebrow">Best for</p>
          <p>{prompt.best}</p>
        </div>
      </section>

      <section className="container prompt-page-cta">
        <span className="chip chip-ink mono">Preview · Get the kit to unlock</span>
        <span className="dim" style={{fontSize:13, marginLeft:14}}>All 175 prompts paste-ready in Claude · $19 one-time</span>
      </section>

      <section className="container">
        {body
          ? <PromptRender body={body} prompt={prompt} preview />
          : <div className="prompt-render"><div className="prompt-render-body" style={{padding:"32px"}}><p className="muted">Full prompt body ships in the kit. Get the $19 kit to unlock all 175 prompts.</p></div></div>
        }
      </section>

      {prompt.tips && prompt.tips.length > 0 && (
        <section className="container prompt-page-tips">
          <p className="eyebrow eyebrow-accent">Pro tips</p>
          <ol className="tips-list">
            {prompt.tips.map((t, i) => <li key={i}>{t}</li>)}
          </ol>
        </section>
      )}


      {prompt.next && prompt.next.length > 0 && (
        <section className="container prompt-page-next">
          <p className="eyebrow eyebrow-accent">Up next</p>
          <h2>Run these after.</h2>
          <p className="lead">In the same flow, these are the prompts that compound on this one.</p>
          <div className="next-grid">
            {prompt.next.map(slug => {
              const p = KIT.BY_SLUG[slug];
              if (p) return <PromptCard prompt={p} key={slug} />;
              return <LockedPromptCard slug={slug} key={slug} />;
            })}
          </div>
          <div className="prompt-page-next-cta">
            <div className="prompt-page-next-cta-text">
              <h3>The other 174 prompts go this deep too.</h3>
              <p className="muted">Welcome flows, BFCM calendars, deliverability triage, post-purchase, win-back. $19, one time.</p>
            </div>
            <div className="cluster" style={{gap:12}}>
              <Button onClick={() => go("/kit/library")} variant="ghost">Browse the library</Button>
              <Button onClick={() => go("/kit#buy")} variant="primary">Get the kit — $19 →</Button>
            </div>
          </div>
        </section>
      )}
    </div>
  );
}

window.Library = Library;
window.PromptPage = PromptPage;
  </script>

  <script type="text/babel" data-presets="react">
/* ============================================
   App — composed (TweaksPanel omitted; defaults from TWEAK_DEFAULTS apply)
   ============================================ */
var { useEffect } = React;
var { useRoute, Nav, CouponBanner, Footer, TWEAK_DEFAULTS } = UI;

function App() {
  const route = useRoute();
  const tweaks = TWEAK_DEFAULTS;

  let page;
  if (route.name === "library") page = <Library />;
  else if (route.name === "prompt") page = <PromptPage slug={route.slug} />;
  else page = <Landing tweaks={tweaks} />;

  return (
    <>
      <CouponBanner tweaks={tweaks} />
      <Nav tweaks={tweaks} route={route} />
      <main>{page}</main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
